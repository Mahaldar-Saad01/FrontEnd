<header class="app-navbar d-flex justify-content-between align-items-center px-4 py-3 w-100">
    <!-- Search bar -->
    <div class="search-pill d-flex align-items-center px-3 py-2 rounded-pill">
        <i class="fa-solid fa-magnifying-glass me-2" style="color: rgba(0,0,0,0.5);"></i>
        <input type="text" class="form-control form-control-sm bg-transparent border-0 shadow-none p-0" style="color: #ffffff;" placeholder="Search tasks, projects..." aria-label="Search">
    </div>

    <!-- Right Controls -->
    <div class="d-flex align-items-center gap-3 ms-3">
        <!-- Messages Trigger -->
        <a href="#chat" class="btn btn-link p-0 fs-5 position-relative nav-icon" aria-label="Messages">
            <i class="fa-regular fa-message"></i>
            <span class="position-absolute top-0 start-100 translate-middle p-1 bg-primary border border-light rounded-circle" style="width:8px; height:8px;"></span>
        </a>

        <!-- Notifications Trigger -->
        <a href="#notifications" class="btn btn-link p-0 fs-5 position-relative nav-icon" aria-label="Notifications">
            <i class="fa-regular fa-bell"></i>
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 0.55rem; padding: 0.25em 0.4em;">3</span>
        </a>

        <!-- Profile Dropdown -->
        <div class="dropdown">
            <button class="btn btn-link p-0 rounded-circle border-0 shadow-none dropdown-toggle-no-caret profile-trigger" type="button" id="profileDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                <img src="" id="nav-user-avatar" alt="Profile" class="rounded-circle w-100 h-100 object-fit-cover border border-secondary profile-avatar">
                
            </button>
            <ul class="dropdown-menu dropdown-menu-end p-2 mt-2 app-dropdown-menu" aria-labelledby="profileDropdown">
                <li class="px-3 py-2 mb-2 border-bottom app-dropdown-header">
                    <div class="fw-bold text-truncate font-size-sm" id="nav-user-name" style="color:#ffffff !important;">Loading...</div>
                    <div class="small text-capitalize font-size-xs" id="nav-user-role"  style="color:#9ca3af !important;">role</div>
                </li>
                <li>
                    <a class="dropdown-item rounded-3 py-2 small" href="#profile" id="nav-profile-link" style="color: #ffffff !important;">
                        <i class="fa-regular fa-user me-2" style="color: #a5b4fc;"></i>My Profile
                    </a>
                </li>
                <li>
                    <a class="dropdown-item rounded-3 py-2 small" href="#settings" id="nav-settings-link" style="color: #ffffff !important;">
                        <i class="fa-solid fa-sliders me-2" style="color: #a5b4fc;"></i>Settings
                    </a>
                </li>
                <li><hr class="dropdown-divider" style="border-color: rgba(255,255,255,0.12);"></li>
                <li>
                    <a class="dropdown-item rounded-3 py-2 text-danger small cursor-pointer logout-action" id="logout-btn">
                        <i class="fa-solid fa-right-from-bracket me-2"></i>Sign Out
                    </a>
                </li>
            </ul>
        </div>
    </div>
</header>
