<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - WorkHub</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/common/base.css">
    <link rel="stylesheet" href="assets/css/common/layout.css">
    <link rel="stylesheet" href="assets/css/common/components.css">
    <link rel="stylesheet" href="assets/css/common/forms.css">
    <style>
        body {
            background: radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15) 0%, rgba(11, 17, 32, 0) 50%), 
                        radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.1) 0%, rgba(11, 17, 32, 0) 50%),
                        #0b0f19 !important;
        }
        .reset-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
    </style>
</head>
<body class="text-white">
    <div class="reset-wrapper">
        <div class="container" style="max-width: 480px;">
            <div class="glass-card fade-in-view">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center rounded-3 text-white fw-bold mb-3" style="background-color:#6366f1; width:48px; height:48px; font-size: 1.5rem;">
                        W
                    </div>
                    <h3 class="fw-bold text-white mb-1">Forgot Password</h3>
                    <p class="text-secondary font-size-sm">Enter your email and we'll send you recovery steps</p>
                </div>

                <div id="alertContainer"></div>

                <form id="resetForm">
                    <div class="mb-4">
                        <label for="email" class="form-label-custom">Email Address</label>
                        <input type="email" class="form-control form-control-custom" id="email" required placeholder="name@workhub.com">
                    </div>
                    <button type="submit" class="btn btn-primary-custom w-100 py-2"><i class="fa-solid fa-paper-plane me-2"></i>Send Reset Link</button>
                </form>

                <div class="text-center mt-4">
                    <p class="small text-secondary mb-0"><a href="login.html" class="text-decoration-none fw-semibold" style="color: var(--primary-accent);"><i class="fa-solid fa-arrow-left me-2"></i>Back to Sign In</a></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('resetForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const alertContainer = document.getElementById('alertContainer');
            
            alertContainer.innerHTML = `
                <div class="alert alert-success d-flex align-items-center mb-4" role="alert" style="background-color: rgba(16, 185, 129, 0.15); border-color: var(--color-success); color: var(--color-success);">
                    <i class="fa-solid fa-circle-check me-2"></i>
                    <div>If an account exists for ${email}, a reset link has been sent.</div>
                </div>
            `;
            document.getElementById('email').value = '';
        });
    </script>
</body>
</html>
