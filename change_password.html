<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - WorkHub</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/common/base.css">
    <link rel="stylesheet" href="assets/css/common/layout.css">
    <link rel="stylesheet" href="assets/css/common/components.css">
    <link rel="stylesheet" href="assets/css/common/forms.css">
    <style>
        body {
            background: radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15) 0%, rgba(11, 17, 32, 0) 50%),
                radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.1) 0%, rgba(11, 17, 32, 0) 50%),
                #0b0f19 !important;
        }

        .change-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
    </style>
</head>

<body class="text-white">
    <div class="change-wrapper">
        <div class="container" style="max-width: 480px;">
            <div class="glass-card fade-in-view">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center rounded-3 text-white fw-bold mb-3"
                        style="background-color:#6366f1; width:48px; height:48px; font-size: 1.5rem;">
                        W
                    </div>
                    <h3 class="fw-bold text-white mb-1">First-Time Setup</h3>
                    <p class="text-secondary font-size-sm">Please set a new password for your account</p>
                    <span id="user-email-badge" class="badge bg-secondary font-size-xs px-2.5 py-1">loading...</span>
                </div>

                <div id="alertContainer"></div>

                <form id="changePasswordForm">
                    <div class="mb-3">
                        <label for="newPassword" class="form-label-custom">New Password</label>
                        <input type="password" class="form-control form-control-custom" id="newPassword" required
                            placeholder="••••••••">
                    </div>
                    <div class="mb-4">
                        <label for="confirmPassword" class="form-label-custom">Confirm New Password</label>
                        <input type="password" class="form-control form-control-custom" id="confirmPassword" required
                            placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn btn-primary-custom w-100 py-2"><i
                            class="fa-solid fa-lock me-2"></i>Update Password</button>
                </form>

                <div class="text-center mt-4">
                    <p class="small text-secondary mb-0"><a href="login.html" class="text-decoration-none fw-semibold"
                            style="color: var(--primary-accent);"><i class="fa-solid fa-arrow-left me-2"></i>Cancel &
                            Sign Out</a></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const email = localStorage.getItem("changePasswordEmail");
            if (!email) {
                window.location.href = "login.html";
                return;
            }

            document.getElementById("user-email-badge").textContent = email;

            document.getElementById("changePasswordForm").addEventListener("submit", async function (e) {
                e.preventDefault();
                const newPassword = document.getElementById("newPassword").value;
                const confirmPassword = document.getElementById("confirmPassword").value;
                const alertContainer = document.getElementById("alertContainer");

                if (newPassword !== confirmPassword) {
                    alertContainer.innerHTML = `
                        <div class="alert alert-danger d-flex align-items-center mb-4" role="alert" style="background-color: rgba(244, 63, 94, 0.15); border-color: var(--color-danger); color: var(--color-danger);">
                            <i class="fa-solid fa-circle-exclamation me-2"></i>
                            <div>Passwords do not match!</div>
                        </div>
                    `;
                    return;
                }

                // Call backend API instead of localstorage mock
                try {
                    const resp = await WorkHubAPI.post('/auth/change-password/', {
                        new_password: newPassword,
                        confirm_password: confirmPassword
                    });
                    
                    const data = await resp.json();
                    
                    if (!resp.ok) {
                        const err = data.new_password?.[0] || data.confirm_password?.[0] || data.detail || 'Failed to update password.';
                        alertContainer.innerHTML = `
                            <div class="alert alert-danger d-flex align-items-center mb-4" role="alert" style="background-color: rgba(244, 63, 94, 0.15); border-color: var(--color-danger); color: var(--color-danger);">
                                <i class="fa-solid fa-circle-exclamation me-2"></i>
                                <div>${err}</div>
                            </div>
                        `;
                        return;
                    }
                    
                    // Clear state and log out user session (they must log in again with new password)
                    WorkHubAPI.clearAuth();
                    localStorage.removeItem("changePasswordEmail");

                    alertContainer.innerHTML = `
                        <div class="alert alert-success d-flex align-items-center mb-4" role="alert" style="background-color: rgba(16, 185, 129, 0.15); border-color: var(--color-success); color: var(--color-success);">
                            <i class="fa-solid fa-circle-check me-2"></i>
                            <div>Password updated successfully! Redirecting to login...</div>
                        </div>
                    `;

                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 1500);
                } catch (err) {
                    console.error('Password change error:', err);
                    alertContainer.innerHTML = `
                        <div class="alert alert-danger d-flex align-items-center mb-4" role="alert" style="background-color: rgba(244, 63, 94, 0.15); border-color: var(--color-danger); color: var(--color-danger);">
                            <i class="fa-solid fa-circle-exclamation me-2"></i>
                            <div>Network error. Ensure backend is running.</div>
                        </div>
                    `;
                }
            });
        });
    </script>
</body>

</html>
