<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProjectFlow - RBAC Enabled System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="d-flex" id="wrapper">
        <div class="border-end bg-white" id="sidebar-wrapper">
            <div class="sidebar-heading border-bottom bg-light">
                <i class="bi bi-person-workspace text-primary fs-3 me-2"></i>
                <span class="fw-bold">ProjectFlow</span>
            </div>
            <div class="list-group list-group-flush" id="main-nav">
                <a href="#dashboard" class="list-group-item list-group-item-action bg-light p-3 nav-link active" id="nav-dashboard">
                    <i class="bi bi-grid-1x2 me-2"></i>Dashboard
                </a>

                <div id="nav-group-superadmin" class="rbac-managed d-none">
                    <div class="sidebar-heading fs-7 text-uppercase text-muted pt-3 pb-1">System Admin</div>
                    <a href="#manage-users" class="list-group-item list-group-item-action bg-light p-3 nav-link" id="nav-users">
                        <i class="bi bi-people-fill me-2"></i>Manage Users
                    </a>
                    <a href="#manage-departments" class="list-group-item list-group-item-action bg-light p-3 nav-link" id="nav-departments">
                        <i class="bi bi-building me-2"></i>Departments
                    </a>
                    <a href="#system-reports" class="list-group-item list-group-item-action bg-light p-3 nav-link" id="nav-sys-reports">
                        <i class="bi bi-file-earmark-bar-graph me-2"></i>View Reports
                    </a>
                </div>

                <div id="nav-group-pm" class="rbac-managed d-none">
                    <div class="sidebar-heading fs-7 text-uppercase text-muted pt-3 pb-1">Project Mgmt</div>
                    <a href="#manage-projects" class="list-group-item list-group-item-action bg-light p-3 nav-link" id="nav-projects">
                        <i class="bi bi-folder-fill me-2"></i>My Projects
                    </a>
                    <a href="#team-reports" class="list-group-item list-group-item-action bg-light p-3 nav-link" id="nav-team-reports">
                        <i class="bi bi-graph-up me-2"></i>Team Reports
                    </a>
                </div>

                <div id="nav-group-employee" class="rbac-managed d-none">
                    <div class="sidebar-heading fs-7 text-uppercase text-muted pt-3 pb-1">My Work</div>
                    <a href="#my-tasks" class="list-group-item list-group-item-action bg-light p-3 nav-link" id="nav-tasks">
                        <i class="bi bi-list-task me-2"></i>My Assigned Tasks
                    </a>
                    <a href="#discussions" class="list-group-item list-group-item-action bg-light p-3 nav-link" id="nav-discussions">
                        <i class="bi bi-chat-left-dots me-2"></i>Discussions
                    </a>
                </div>

                <a href="#calendar" class="list-group-item list-group-item-action bg-light p-3 nav-link" id="nav-calendar">
                    <i class="bi bi-calendar4 me-2"></i>Calendar
                </a>
                <a href="#settings" class="list-group-item list-group-item-action bg-light p-3 nav-link" id="nav-settings">
                    <i class="bi bi-gear me-2"></i>Settings
                </a>
            </div>
        </div>
        <div id="page-content-wrapper">
            <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom p-3">
                <div class="container-fluid">
                    <button class="btn btn-sm btn-outline-primary me-3" id="menu-toggle"><i class="bi bi-list"></i></button>
                    
                    <div id="role-action-area" class="d-flex align-items-center me-auto">
                        <button class="btn btn-success btn-sm d-none" id="btn-pm-create-project"><i class="bi bi-plus-lg me-1"></i>New Project (PM)</button>
                        <button class="btn btn-primary btn-sm d-none" id="btn-admin-add-user"><i class="bi bi-person-plus me-1"></i>Add User (Admin)</button>
                    </div>

                    <div class="d-flex align-items-center ms-auto flex-shrink-0 text-nowrap">
                        <span class="text-muted fs-7 me-2">Mock Login:</span>
                        <select class="form-select form-select-sm me-3" style="width: auto;" id="mock-login-selector">
                            <option value="superadmin" selected>Super Admin</option>
                            <option value="pm">Project Manager</option>
                            <option value="employee">Employee</option>
                        </select>
                        <div class="avatar me-2" id="user-avatar-initials">--</div>
                        <div>
                            <span class="fw-bold d-block" id="user-display-name">Loading...</span>
                            <span class="text-muted fs-7" id="user-display-role">...</span>
                        </div>
                    </div>
                </div>
            </nav>

            <main class="container-fluid px-4 pt-4" id="main-view-container">
               </main>

        </div>
        </div>
        
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
