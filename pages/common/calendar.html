<div class="container-fluid py-3 h-100 d-flex flex-column fade-in-view">
    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="mb-1 fw-bold text-white">Calendar</h4>
            <p class="text-secondary small mb-0">Manage and schedule team deliverables</p>
        </div>
        <button class="btn btn-primary-custom" data-bs-toggle="modal" data-bs-target="#addEventModal">
            <i class="fa-solid fa-plus me-2"></i>Add Event
        </button>
    </div>

    <!-- Calendar Layout Grid -->
    <div class="row flex-grow-1 g-4">
        <!-- Main Calendar Grid -->
        <div class="col-lg-9 col-md-12">
            <div class="card-custom h-100 d-flex flex-column p-4">
                <!-- Month Navigator -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="fw-bold mb-0 text-dark" id="calendar-month-year">June 2026</h5>
                    <div class="d-flex gap-2">
                        <button class="btn btn-secondary-custom btn-sm py-1 px-2" id="prev-month-btn">
                            <i class="fa-solid fa-chevron-left"></i>
                        </button>
                        <button class="btn btn-secondary-custom btn-sm py-1 px-2" id="today-btn">Today</button>
                        <button class="btn btn-secondary-custom btn-sm py-1 px-2" id="next-month-btn">
                            <i class="fa-solid fa-chevron-right"></i>
                        </button>
                    </div>
                </div>

                <!-- Grid Header (Days of week) -->
                <div class="row text-center text-secondary small fw-semibold mb-2" style="border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">
                    <div class="col">Mon</div>
                    <div class="col">Tue</div>
                    <div class="col">Wed</div>
                    <div class="col">Thu</div>
                    <div class="col">Fri</div>
                    <div class="col">Sat</div>
                    <div class="col">Sun</div>
                </div>

                <!-- Days Grid container -->
                <div class="row row-cols-7 g-2 flex-grow-1" id="calendar-days-grid" style="display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: 1fr; min-height: 400px;">
                    <!-- Dynamically Generated Days -->
                </div>
            </div>
        </div>

        <!-- Right Agenda Panel -->
        <div class="col-lg-3 col-md-12">
            <div class="card-custom h-100 p-4 d-flex flex-column">
                <h5 class="fw-bold mb-3 text-dark">Upcoming Events</h5>
                
                <div class="flex-grow-1 overflow-auto hide-scrollbar d-flex flex-column gap-3" id="calendar-events-agenda">
                    <!-- Dynamically Injected Agenda Cards -->
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Add Event Modal -->
<div class="modal fade" id="addEventModal" tabindex="-1" aria-labelledby="addEventModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content modal-content-custom">
            <div class="modal-header modal-header-custom">
                <h5 class="modal-title fw-bold text-white" id="addEventModalLabel">Schedule New Event</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="addEventForm">
                <div class="modal-body p-4">
                    <div class="mb-3">
                        <label for="eventTitle" class="form-label-custom">Event Title</label>
                        <input type="text" class="form-control form-control-custom" id="eventTitle" required placeholder="e.g. Sprint Review">
                    </div>
                    <div class="row">
                        <div class="col-6 mb-3">
                            <label for="eventDate" class="form-label-custom">Date</label>
                            <input type="date" class="form-control form-control-custom" id="eventDate" required>
                        </div>
                        <div class="col-6 mb-3">
                            <label for="eventTime" class="form-label-custom">Time</label>
                            <input type="time" class="form-control form-control-custom" id="eventTime" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="eventCategory" class="form-label-custom">Category</label>
                        <select class="form-select form-select-custom" id="eventCategory" required>
                            <option value="sprint" selected>Sprint Meeting</option>
                            <option value="client">Client Sync</option>
                            <option value="review">Code Review</option>
                            <option value="social">Team Social</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="eventDesc" class="form-label-custom">Description</label>
                        <textarea class="form-control form-control-custom" id="eventDesc" rows="3" placeholder="Brief event summary..."></textarea>
                    </div>
                </div>
                <div class="modal-footer modal-footer-custom">
                    <button type="button" class="btn btn-secondary-custom" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary-custom">Create Event</button>
                </div>
            </form>
        </div>
    </div>
</div>
