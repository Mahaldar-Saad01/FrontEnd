<div class="container-fluid py-3 h-100 d-flex flex-column fade-in-view position-relative">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="mb-1 fw-bold text-white">Meetings</h4>
            <p class="text-secondary small mb-0">Schedule and connect for synchronous collaboration</p>
        </div>
        <button class="btn btn-primary-custom" data-bs-toggle="modal" data-bs-target="#scheduleMeetingModal">
            <i class="fa-solid fa-plus me-2"></i>Schedule Meeting
        </button>
    </div>

    <!-- Meetings Listing -->
    <div class="row g-4" id="meetings-list-container">
        <!-- Dynamically injected meeting cards -->
    </div>

    <!-- Simulated Active Video Call View (Hidden initially) -->
    <div id="video-call-overlay" class="position-absolute top-0 start-0 w-100 h-100 bg-dark rounded-4 shadow-lg flex-column p-4 d-none" style="z-index: 1050; background-color: #0b0f19 !important; border: 1px solid var(--border-color);">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h5 class="fw-bold text-white mb-0" id="call-meeting-title">Daily Sprint Standup</h5>
                <small class="text-success"><i class="fa-solid fa-circle-play me-1 small"></i>Live Call (04:12)</small>
            </div>
            <div class="d-flex gap-2">
                <span class="badge bg-secondary rounded-pill py-2 px-3"><i class="fa-solid fa-users me-2"></i>4 active</span>
            </div>
        </div>

        <!-- Video grid -->
        <div class="row flex-grow-1 g-3 align-items-center justify-content-center mb-4" style="min-height: 280px;">
            <div class="col-md-6 col-sm-12 h-100">
                <div class="card-custom h-100 d-flex flex-column align-items-center justify-content-center border-0 text-center relative overflow-hidden" style="background-color: #1f2937; min-height: 160px;">
                    <img src="https://ui-avatars.com/api/?name=Saad+Mahaldar&background=6366f1&color=fff" class="rounded-circle mb-2" style="width: 64px; height: 64px;" alt="Saad">
                    <h6 class="fw-semibold text-white mb-0">Saad Mahaldar (You)</h6>
                    <span class="position-absolute bottom-3 end-3 badge bg-dark opacity-75"><i class="fa-solid fa-microphone"></i></span>
                </div>
            </div>
            <div class="col-md-6 col-sm-12 h-100">
                <div class="card-custom h-100 d-flex flex-column align-items-center justify-content-center border-0 text-center relative overflow-hidden" style="background-color: #1f2937; min-height: 160px;">
                    <img src="https://ui-avatars.com/api/?name=Sarah+Miller&background=10b981&color=fff" class="rounded-circle mb-2" style="width: 64px; height: 64px;" alt="Sarah">
                    <h6 class="fw-semibold text-white mb-0">Sarah Miller</h6>
                    <span class="position-absolute bottom-3 end-3 badge bg-dark opacity-75"><i class="fa-solid fa-microphone text-danger"></i></span>
                </div>
            </div>
            <div class="col-md-6 col-sm-12 h-100">
                <div class="card-custom h-100 d-flex flex-column align-items-center justify-content-center border-0 text-center relative overflow-hidden" style="background-color: #1f2937; min-height: 160px;">
                    <img src="https://ui-avatars.com/api/?name=Rihan+Kahn&background=f59e0b&color=fff" class="rounded-circle mb-2" style="width: 64px; height: 64px;" alt="Rihan">
                    <h6 class="fw-semibold text-white mb-0">Rihan Kahn</h6>
                    <span class="position-absolute bottom-3 end-3 badge bg-dark opacity-75"><i class="fa-solid fa-microphone"></i></span>
                </div>
            </div>
            <div class="col-md-6 col-sm-12 h-100">
                <div class="card-custom h-100 d-flex flex-column align-items-center justify-content-center border-0 text-center relative overflow-hidden" style="background-color: #1f2937; min-height: 160px;">
                    <img src="https://ui-avatars.com/api/?name=Alex+Mercer&background=06b6d4&color=fff" class="rounded-circle mb-2" style="width: 64px; height: 64px;" alt="Alex">
                    <h6 class="fw-semibold text-white mb-0">Alex Mercer</h6>
                    <span class="position-absolute bottom-3 end-3 badge bg-dark opacity-75"><i class="fa-solid fa-microphone"></i></span>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div class="d-flex justify-content-center gap-3">
            <button class="btn btn-secondary-custom rounded-circle p-3" id="call-mic-toggle" style="width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;">
                <i class="fa-solid fa-microphone"></i>
            </button>
            <button class="btn btn-secondary-custom rounded-circle p-3" id="call-video-toggle" style="width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;">
                <i class="fa-solid fa-video"></i>
            </button>
            <button class="btn btn-danger rounded-circle p-3" id="leave-call-btn" style="width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;">
                <i class="fa-solid fa-phone-slash"></i>
            </button>
        </div>
    </div>
</div>

<!-- Schedule Meeting Modal -->
<div class="modal fade" id="scheduleMeetingModal" tabindex="-1" aria-labelledby="scheduleMeetingModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content modal-content-custom">
            <div class="modal-header modal-header-custom">
                <h5 class="modal-title fw-bold text-white" id="scheduleMeetingModalLabel">Schedule Team Meeting</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="scheduleMeetingForm">
                <div class="modal-body p-4">
                    <div class="mb-3">
                        <label for="meetingTitle" class="form-label-custom">Meeting Title</label>
                        <input type="text" class="form-control form-control-custom" id="meetingTitle" required placeholder="e.g. Frontend Architecture Review">
                    </div>
                    <div class="row">
                        <div class="col-6 mb-3">
                            <label for="meetingDate" class="form-label-custom">Date</label>
                            <input type="date" class="form-control form-control-custom" id="meetingDate" required>
                        </div>
                        <div class="col-6 mb-3">
                            <label for="meetingTime" class="form-label-custom">Time</label>
                            <input type="time" class="form-control form-control-custom" id="meetingTime" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-6 mb-3">
                            <label for="meetingDuration" class="form-label-custom">Duration (mins)</label>
                            <input type="number" class="form-control form-control-custom" id="meetingDuration" value="30" min="15" required>
                        </div>
                        <div class="col-6 mb-3">
                            <label for="meetingPlatform" class="form-label-custom">Platform</label>
                            <select class="form-select form-select-custom" id="meetingPlatform" required>
                                <option value="Zoom" selected>Zoom</option>
                                <option value="MS Teams">MS Teams</option>
                                <option value="Google Meet">Google Meet</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="meetingTopic" class="form-label-custom">Agenda/Topic</label>
                        <textarea class="form-control form-control-custom" id="meetingTopic" rows="3" placeholder="Brief outline of topics..."></textarea>
                    </div>
                </div>
                <div class="modal-footer modal-footer-custom">
                    <button type="button" class="btn btn-secondary-custom" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary-custom">Schedule</button>
                </div>
            </form>
        </div>
    </div>
</div>
