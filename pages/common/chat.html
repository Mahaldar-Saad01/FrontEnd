<div id="main-chat-container" class="container-fluid py-2 h-100 d-flex flex-column fade-in-view overflow-hidden">
        <div class="row bg-white rounded-4 shadow-sm overflow-hidden m-1 flex-grow-1" style="min-height: 0;">
            
            <div class="col-lg-3 col-md-4 border-end p-3 d-flex flex-column messages-sidebar h-100">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="mb-0 fw-bold">Messages</h4>
                    <button class="btn btn-light btn-sm rounded-circle"><i class="fa-solid fa-pen-to-square"></i></button>
                </div>
                
                <div class="input-group mb-3 custom-search">
                    <span class="input-group-text bg-light border-0"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                    <input type="text" class="form-control bg-light border-0" placeholder="Search...">
                </div>

                <div class="online-now mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="text-muted small fw-semibold">Online now</span>
                        <a href="#" class="text-primary small text-decoration-none">All</a>
                    </div>
                    <div id="chat-online-list" class="d-flex gap-2 overflow-auto hide-scrollbar"></div>
                </div>

                <div class="chat-list flex-grow-1 overflow-auto hide-scrollbar" style="min-height: 0;">
                    <div class="chat-item chat-channel-btn d-flex align-items-center p-2 mb-2 bg-light rounded-3 cursor-pointer"
                         data-room="general"
                         data-name="Team Chat"
                         data-desc="Everyone in the workspace">
                        <img src="https://ui-avatars.com/api/?name=Team+Chat&background=6366f1&color=fff" class="avatar-md rounded-circle me-3" alt="Team Chat">
                        <div class="flex-grow-1 min-w-0">
                            <div class="d-flex justify-content-between">
                                <h6 class="mb-0 text-truncate fw-bold">Team Chat</h6>
                            </div>
                            <p class="mb-0 text-muted small text-truncate">Everyone in the workspace</p>
                        </div>
                    </div>
                    <div id="chat-users-list"></div>
                </div>
            </div>

            <div class="col-lg-6 col-md-8 border-end p-0 d-flex flex-column active-chat-area h-100">
                <div class="p-3 border-bottom d-flex justify-content-between align-items-center bg-white">
                    <div class="d-flex align-items-center">
                        <img id="chat-active-avatar" src="https://ui-avatars.com/api/?name=Team+Chat&background=6366f1&color=fff" class="avatar-md rounded-circle me-3" alt="Team Chat">
                        <div>
                            <h5 id="chat-active-name" class="mb-0 fw-bold">Team Chat</h5>
                            <small id="chat-active-desc" class="text-primary fw-semibold">Everyone in the workspace</small>
                        </div>
                    </div>
                    <div class="d-flex gap-3 text-muted">
                        <i class="fa-solid fa-video cursor-pointer"></i>
                        <i class="fa-solid fa-phone cursor-pointer"></i>
                        <i class="fa-solid fa-ellipsis-vertical cursor-pointer"></i>
                    </div>
                </div>

                <div id="chat-messages-container" class="p-4 flex-grow-1 overflow-auto bg-chat-bg hide-scrollbar d-flex flex-column gap-3" style="min-height: 0;"></div>

                <div class="p-3 bg-white border-top">
                    <form id="chat-form">
                        <div class="input-group align-items-center p-1 border rounded-pill bg-light">

                            <button type="button" class="btn btn-light rounded-circle text-muted border-0 ms-1">
                                <i class="fa-solid fa-paperclip"></i>
                            </button>

                            <input
                                type="text"
                                id="chat-message-input"
                                class="form-control border-0 bg-transparent shadow-none"
                                placeholder="Write a message..."
                            >

                            <button type="button" class="btn btn-light rounded-circle text-muted border-0">
                                <i class="fa-regular fa-face-smile"></i>
                            </button>

                            <button
                                type="submit"
                                id="chat-send-btn"
                                class="btn btn-primary rounded-circle me-1"
                                style="background:#6c5ce7;border-color:#6c5ce7;width:36px;height:36px;"
                            >
                                <i class="fa-solid fa-paper-plane"></i>
                            </button>

                        </div>
                    </form>
                </div>
            </div>

            <div class="col-lg-3 d-none d-lg-flex flex-column p-4 bg-white right-sidebar h-100 overflow-auto hide-scrollbar">
                <div class="d-flex justify-content-end align-items-center mb-4 gap-3">
                    <div class="form-check form-switch m-0">
                        <input class="form-check-input" type="checkbox" id="darkModeSwitch" checked>
                        <label class="form-check-label small text-muted" for="darkModeSwitch">Dark</label>
                    </div>
                    <i class="fa-regular fa-bell text-muted"></i>
                    <img id="chat-profile-avatar" src="https://ui-avatars.com/api/?name=User&background=6366f1&color=fff" class="avatar-sm rounded-circle" alt="Profile">
                </div>

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold mb-0">Timeline</h5>
                    <button class="btn btn-dark btn-sm rounded-pill px-3"><i class="fa-solid fa-plus me-1"></i> Add event</button>
                </div>

                <div class="calendar-widget mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="fw-semibold small">March 2026</span>
                        <div>
                            <button class="btn btn-sm btn-link text-dark p-0"><i class="fa-solid fa-chevron-left fa-xs"></i></button>
                            <button class="btn btn-sm btn-link text-dark p-0 ms-2"><i class="fa-solid fa-chevron-right fa-xs"></i></button>
                        </div>
                    </div>
                    <div class="calendar-grid text-center small" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px;">
                        <div class="text-muted mb-1">Mo</div><div class="text-muted mb-1">Tu</div><div class="text-muted mb-1">We</div><div class="text-muted mb-1">Th</div><div class="text-muted mb-1">Fr</div><div class="text-muted mb-1">Sa</div><div class="text-muted mb-1">Su</div>
                        <div class="p-1">28</div><div class="p-1">1</div><div class="p-1">2</div><div class="p-1">3</div><div class="p-1">4</div><div class="p-1">5</div><div class="p-1 text-muted">6</div>
                        <div class="p-1">7</div><div class="p-1">8</div><div class="p-1">9</div><div class="p-1">10</div><div class="p-1 text-white rounded-circle" style="background-color: #6c5ce7;">11</div><div class="p-1">12</div><div class="p-1">13</div>
                    </div>
                </div>

                <h6 class="fw-bold mb-3">Plans for the day <span class="text-muted fw-normal small ms-1">Tomorrow</span></h6>
                
                <div class="plan-item d-flex align-items-center p-3 mb-2 bg-dark text-white rounded-4">
                    <div class="form-check m-0 me-3">
                        <input class="form-check-input rounded-circle border-0 bg-white" type="checkbox" checked>
                    </div>
                    <div>
                        <h6 class="mb-0 fw-semibold">Review FastApi Code</h6>
                        <small class="text-white-50">Check endpoints</small>
                    </div>
                </div>

                <div class="plan-item d-flex align-items-center p-3 mb-2 border border-light rounded-4">
                    <div class="form-check m-0 me-3">
                        <input class="form-check-input rounded-circle border-secondary" type="checkbox">
                    </div>
                    <div>
                        <h6 class="mb-0 fw-semibold text-muted">Talakona Trip Plan</h6>
                        <small class="text-muted opacity-75">Confirm with 8 friends</small>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Search all employees modal -->
    <div class="modal fade" id="searchAllUsersModal" tabindex="-1" aria-labelledby="searchAllUsersModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-md">
            <div class="modal-content modal-content-custom border" style="background-color: var(--bg-panel); border-color: var(--border-color) !important; border-radius: 16px;">
                <div class="modal-header modal-header-custom border-bottom" style="border-color: var(--border-color) !important; padding: 1rem 1.5rem;">
                    <h5 class="modal-title fw-bold text-white mb-0" id="searchAllUsersModalLabel">Start a New Chat</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4" style="max-height: 400px; overflow-y: auto;">
                    <div class="input-group mb-3 custom-search">
                        <span class="input-group-text bg-light border-0"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                        <input type="text" id="modal-user-search" class="form-control bg-light border-0 text-white" placeholder="Search by name or role..." style="background-color: var(--bg-input) !important; border-color: var(--border-color) !important;">
                    </div>
                    <div id="modal-users-list" class="d-flex flex-column gap-2">
                        <!-- Filled by JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
