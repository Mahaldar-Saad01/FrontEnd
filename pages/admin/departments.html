<div class="container-fluid py-3 h-100 d-flex flex-column fade-in-view">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="mb-1 fw-bold text-white">Department Management</h4>
            <p class="text-secondary small mb-0">Organize company structures, leaders, and headcounts</p>
        </div>
        <button class="btn btn-primary-custom" data-bs-toggle="modal" data-bs-target="#addDeptModal">
            <i class="fa-solid fa-plus me-2"></i>Add Department
        </button>
    </div>

    <!-- Grid Container -->
    <div class="row g-4" id="departments-grid-container">
        <!-- Injected Cards -->
    </div>
</div>

<!-- Add Department Modal -->
<div class="modal fade" id="addDeptModal" tabindex="-1" aria-labelledby="addDeptModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content modal-content-custom">
            <div class="modal-header modal-header-custom">
                <h5 class="modal-title fw-bold text-white" id="addDeptModalLabel">Form New Department</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="addDeptForm">
                <div class="modal-body p-4">
                    <div class="mb-3">
                        <label for="deptName" class="form-label-custom">Department Name</label>
                        <input type="text" class="form-control form-control-custom" id="deptName" required placeholder="e.g. Quality Assurance">
                    </div>
                    <div class="mb-3">
                        <label for="deptLead" class="form-label-custom">Lead Manager</label>
                        <select class="form-select form-select-custom" id="deptLead" required>
                            <option value="" disabled selected>Select Lead Manager...</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="deptCount" class="form-label-custom">Starting Headcount</label>
                        <input type="number" class="form-control form-control-custom" id="deptCount" value="1" min="1" required>
                    </div>
                </div>
                <div class="modal-footer modal-footer-custom">
                    <button type="button" class="btn btn-secondary-custom" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary-custom">Create Department</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Department Detail Modal -->
<div class="modal fade" id="deptDetailModal" tabindex="-1" aria-labelledby="deptDetailModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content modal-content-custom">
            <div class="modal-header modal-header-custom">
                <h5 class="modal-title fw-bold text-white" id="deptDetailModalLabel">Department</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-3">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div>
                        <h5 id="dept-detail-name" class="fw-bold text-white mb-0">Engineering</h5>
                        <small id="dept-detail-sub" class="text-secondary">Manage engineering department members and their projects</small>
                    </div>
                    <div>
                        <span class="badge bg-secondary rounded-pill font-size-xs px-2.5 py-1" id="dept-detail-count">0 Members</span>
                    </div>
                </div>

                <div class="table-custom-container">
                    <table class="table-custom">
                        <thead>
                            <tr>
                                <th>Employee</th>
                                <th>Project</th>
                                <th>Manager</th>
                                <th>Role</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="dept-members-body">
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer modal-footer-custom">
                <button type="button" class="btn btn-secondary-custom" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>
