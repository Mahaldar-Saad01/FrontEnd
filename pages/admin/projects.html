<div class="container-fluid py-3 h-100 d-flex flex-column fade-in-view">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="mb-1 fw-bold text-white">Project Directory</h4>
            <p class="text-secondary small mb-0">Monitor team progress, budgets, and managers</p>
        </div>
        <button class="btn btn-primary-custom" data-bs-toggle="modal" data-bs-target="#addProjectModal">
            <i class="fa-solid fa-plus me-2"></i>Add Project
        </button>
    </div>

    <!-- Directory Table -->
    <div class="table-custom-container">
        <table class="table-custom">
            <thead>
                <tr>
                    <th>Project Name</th>
                    <th>Lead Manager</th>
                    <th>Department</th>
                    <th>Status</th>
                    <th>Progress</th>
                    <th class="text-end">Actions</th>
                </tr>
            </thead>
            <tbody id="projects-table-body">
                <!-- Dynamically populated projects -->
            </tbody>
        </table>
    </div>
</div>

<!-- Add Project Modal -->
<div class="modal fade" id="addProjectModal" tabindex="-1" aria-labelledby="addProjectModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content modal-content-custom">
            <div class="modal-header modal-header-custom">
                <h5 class="modal-title fw-bold text-white" id="addProjectModalLabel">Launch New Project</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="addProjectForm">
                <div class="modal-body p-4">
                    <div class="mb-3">
                        <label for="projectName" class="form-label-custom">Project Name</label>
                        <input type="text" class="form-control form-control-custom" id="projectName" required placeholder="e.g. WorkHub Redesign">
                    </div>
                    <div class="mb-3">
                        <label for="projectManager" class="form-label-custom">Lead Manager</label>
                        <select class="form-select form-select-custom" id="projectManager" required>
                            <!-- Dynamically loaded from employees -->
                            <option value="Sarah Miller" selected>Sarah Miller</option>
                            <option value="Saad Mahaldar">Saad Mahaldar</option>
                            <option value="Alex Mercer">Alex Mercer</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="projectDept" class="form-label-custom">Department</label>
                        <select class="form-select form-select-custom" id="projectDept" required>
                            <option value="Engineering" selected>Engineering</option>
                            <option value="Design">Design</option>
                            <option value="Marketing">Marketing</option>
                            <option value="HR">HR</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="projectStatus" class="form-label-custom">Initial Status</label>
                        <select class="form-select form-select-custom" id="projectStatus" required>
                            <option value="Active" selected>Active</option>
                            <option value="Pending">Pending</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer modal-footer-custom">
                    <button type="button" class="btn btn-secondary-custom" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary-custom">Create Project</button>
                </div>
            </form>
        </div>
    </div>
</div>
