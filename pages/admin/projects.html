<div class="container-fluid py-3 h-100 d-flex flex-column fade-in-view">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="mb-1 fw-bold text-dark">Project Directory</h4>
            <p class="text-secondary small mb-0">Monitor team progress, budgets, and managers</p>
        </div>
        <button class="btn btn-primary-custom" data-bs-toggle="modal" data-bs-target="#addProjectModal" data-bs-backdrop="false">
            <i class="fa-solid fa-plus me-2"></i>Add Project
        </button>
    </div>

    <!-- Directory Table -->
    <div class="table-custom-container">
        <table class="table-custom">
            <thead>
                <tr>
                    <th>Project Name</th>
                    <th>Lead Manager</th>
                    <th>Department</th>
                    <th>Project Docs</th>
                    <th>Status</th>
                    <th>Progress</th>
                    <th class="text-end">Actions</th>
                </tr>
            </thead>
            <tbody id="projects-table-body">
                <!-- Dynamically populated projects -->
            </tbody>
        </table>
    </div>
</div>

<!-- Add Project Modal -->
<div class="modal fade" id="addProjectModal" tabindex="-1" aria-labelledby="addProjectModalLabel" aria-hidden="true" data-bs-backdrop="false">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content modal-content-custom">
            <div class="modal-header modal-header-custom">
                <h5 class="modal-title fw-bold text-white" id="addProjectModalLabel">Launch New Project</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="addProjectForm" aria-labelledby="addProjectModalLabel" autocomplete="off">
                <div class="modal-body p-4">
                    <div class="mb-3">
                        <label for="projectName" class="form-label-custom">Project Name</label>
                        <input type="text" class="form-control form-control-custom" id="projectName" name="name" required placeholder="e.g. WorkHub Redesign" autocomplete="off">
                    </div>
                    <div class="mb-3">
                        <label for="projectManager" class="form-label-custom">Lead Manager</label>
                        <select class="form-select form-select-custom" id="projectManager" name="lead_manager" required aria-label="Lead Manager">
                            <option value="" disabled selected>Select Lead Manager...</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="projectDept" class="form-label-custom">Department</label>
                        <select class="form-select form-select-custom" id="projectDept" name="department" required aria-label="Department">
                            <option value="" disabled selected>Select Department...</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="projectDocument" class="form-label-custom">Project Docs</label>
                        <input type="file" class="form-control form-control-custom" id="projectDocument" name="original_document" accept="application/pdf,.pdf" aria-label="Project Docs">
                        <small class="text-secondary-custom d-block mt-2">Only PDF files are allowed.</small>
                    </div>
                    <div class="mb-3">
                        <label for="projectStatus" class="form-label-custom">Initial Status</label>
                        <select class="form-select form-select-custom" id="projectStatus" name="status" required aria-label="Initial Status">
                            <option value="Active" selected>Active</option>
                            <option value="Pending">Pending</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer modal-footer-custom">
                    <button type="button" class="btn btn-secondary-custom" data-bs-dismiss="modal" aria-label="Cancel project creation">Cancel</button>
                    <button type="submit" class="btn btn-primary-custom" aria-label="Create project">Create Project</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Project Document Preview Modal -->
<div class="modal fade document-preview-modal" id="projectDocumentPreviewModal" tabindex="-1" aria-labelledby="projectDocumentPreviewTitle" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content document-preview-content">
            <div class="document-preview-header">
                <div class="d-flex align-items-center gap-3 min-w-0">
                    <span class="document-preview-icon"><i class="fa-regular fa-file-pdf"></i></span>
                    <div class="min-w-0">
                        <h5 class="modal-title text-truncate mb-1" id="projectDocumentPreviewTitle">Project document</h5>
                        <p class="mb-0">PDF preview</p>
                    </div>
                </div>
                <div class="document-preview-actions">
                    <a id="projectDocumentOpenLink" class="btn btn-sm btn-secondary-custom" href="#" target="_blank" rel="noopener">
                        <i class="fa-solid fa-arrow-up-right-from-square me-1"></i>Open
                    </a>
                    <a id="projectDocumentDownloadLink" class="btn btn-sm btn-primary-custom" href="#" download>
                        <i class="fa-solid fa-download me-1"></i>Download
                    </a>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close document preview"></button>
                </div>
            </div>
            <div class="document-preview-body">
                <div class="document-preview-loading" id="projectDocumentPreviewLoading">
                    <div class="spinner-border text-primary" role="status"></div>
                    <span>Loading PDF preview...</span>
                </div>
                <iframe id="projectDocumentPreviewFrame" title="Project document preview"></iframe>
            </div>
        </div>
    </div>
</div>
