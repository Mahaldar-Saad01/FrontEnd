<div class="container-fluid py-3 h-100 d-flex flex-column fade-in-view">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="mb-1 fw-bold text-white">Project Approvals</h4>
            <p class="text-secondary small mb-0">Review and approve new project requests submitted by managers</p>
        </div>
    </div>

    <!-- Approvals Table -->
    <div class="table-custom-container">
        <table class="table-custom">
            <thead>
                <tr>
                    <th>Project Name</th>
                    <th>Lead Manager</th>
                    <th>Department</th>
                    <th>Status</th>
                    <th>Submitted Date</th>
                    <th class="text-end">Actions</th>
                </tr>
            </thead>
            <tbody id="approvals-table-body">
                <!-- Dynamically populated approvals -->
            </tbody>
        </table>
    </div>
</div>
