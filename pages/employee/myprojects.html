<div class="container-fluid py-3 h-100 d-flex flex-column fade-in-view">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="mb-1 fw-bold text-white">My Projects</h4>
            <p class="text-secondary small mb-0">Track sprint progress and allocations for projects you are assigned to</p>
        </div>
    </div>

    <!-- Directory Table -->
    <div class="table-custom-container">
        <table class="table-custom">
            <thead>
                <tr>
                    <th>Project Name</th>
                    <th>Lead Manager</th>
                    <th>Department</th>
                    <th>Project docs</th>
                    <th>Status</th>
                    <th>Progress</th>
                    <th class="text-end">Actions</th>
                </tr>
            </thead>
            <tbody id="projects-table-body">
                <!-- Dynamically populated projects -->
            </tbody>
        </table>
    </div>
</div>

<!-- Project Document Preview Modal -->
<div class="modal fade document-preview-modal" id="projectDocumentPreviewModal" tabindex="-1" aria-labelledby="projectDocumentPreviewTitle" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content document-preview-content">
            <div class="document-preview-header">
                <div class="d-flex align-items-center gap-3 min-w-0">
                    <span class="document-preview-icon"><i class="fa-regular fa-file-pdf"></i></span>
                    <div class="min-w-0">
                        <h5 class="modal-title text-truncate mb-1" id="projectDocumentPreviewTitle">Project document</h5>
                        <p class="mb-0">PDF preview</p>
                    </div>
                </div>
                <div class="document-preview-actions">
                    <a id="projectDocumentOpenLink" class="btn btn-sm btn-secondary-custom" href="#" target="_blank" rel="noopener">
                        <i class="fa-solid fa-arrow-up-right-from-square me-1"></i>Open
                    </a>
                    <a id="projectDocumentDownloadLink" class="btn btn-sm btn-primary-custom" href="#" download>
                        <i class="fa-solid fa-download me-1"></i>Download
                    </a>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close document preview"></button>
                </div>
            </div>
            <div class="document-preview-body">
                <div class="document-preview-loading" id="projectDocumentPreviewLoading">
                    <div class="spinner-border text-primary" role="status"></div>
                    <span>Loading PDF preview...</span>
                </div>
                <iframe id="projectDocumentPreviewFrame" title="Project document preview"></iframe>
            </div>
        </div>
    </div>
</div>
