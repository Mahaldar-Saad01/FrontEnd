<div class="container-fluid py-3 h-100 d-flex flex-column fade-in-view">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="mb-1 fw-bold text-white">My Tasks Checklist</h4>
            <p class="text-secondary small mb-0">Track and update the status of your assigned deliverables</p>
        </div>
    </div>

    <!-- Filters Bar -->
    <div class="card-custom p-3 mb-4">
        <div class="row g-3">
            <div class="col-md-4 col-sm-12">
                <div class="input-group align-items-center px-2 py-1 rounded-pill" style="background-color: var(--bg-main); border: 1px solid var(--border-color);">
                    <i class="fa-solid fa-magnifying-glass text-muted me-2"></i>
                    <input type="text" id="mytask-search-input" class="form-control bg-transparent border-0 text-white shadow-none p-0" placeholder="Search my tasks...">
                </div>
            </div>
            <div class="col-md-4 col-sm-6">
                <select class="form-select form-select-custom" id="myfilter-priority">
                    <option value="all">All Priorities</option>
                    <option value="high">High Priority</option>
                    <option value="medium">Medium Priority</option>
                    <option value="low">Low Priority</option>
                </select>
            </div>
            <div class="col-md-4 col-sm-6">
                <select class="form-select form-select-custom" id="myfilter-status">
                    <option value="all">All Statuses</option>
                    <option value="todo">To Do</option>
                    <option value="progress">In Progress</option>
                    <option value="review">In Review</option>
                    <option value="done">Completed</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Tasks Table -->
    <div class="table-custom-container">
        <table class="table-custom">
            <thead>
                <tr>
                    <th>Task Name</th>
                    <th>Project</th>
                    <th>Department</th>
                    <th>Priority</th>
                    <th>Status</th>
                    <th class="text-end">Update Status</th>
                </tr>
            </thead>
            <tbody id="mytasks-table-body">
                <!-- Dynamically injected rows -->
            </tbody>
        </table>
    </div>

    <!-- Submit Task Review Modal -->
    <div class="modal fade" id="submitReviewModal" tabindex="-1" aria-labelledby="submitReviewModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-content-custom">
                <div class="modal-header modal-header-custom">
                    <h5 class="modal-title fw-bold text-white" id="submitReviewModalLabel">Submit Task for Review</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="submitReviewForm">
                    <input type="hidden" id="reviewTaskId">
                    <div class="modal-body p-4 text-white">
                        <div class="mb-3">
                            <label for="reviewTaskTitle" class="form-label-custom">Task Title</label>
                            <input type="text" class="form-control form-control-custom" id="reviewTaskTitle" readonly>
                        </div>
                        <div class="mb-3">
                            <label for="reviewReport" class="form-label-custom">Task Progress Report / Deliverables</label>
                            <textarea class="form-control form-control-custom" id="reviewReport" rows="5" required placeholder="Describe what you completed, details of deliverables, links, etc."></textarea>
                        </div>
                    </div>
                    <div class="modal-footer modal-footer-custom">
                        <button type="button" class="btn btn-secondary-custom" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary-custom">Send to Manager</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
