<div class="container-fluid py-3 h-100 d-flex flex-column fade-in-view">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="mb-1 fw-bold text-white">Lead Projects</h4>
            <p class="text-secondary small mb-0">Track sprint progress and allocations for projects you manage</p>
        </div>
        <button class="btn btn-primary-custom" data-bs-toggle="modal" data-bs-target="#addProjectModal">
            <i class="fa-solid fa-plus me-2"></i>Add Project
        </button>
    </div>

    <!-- Tabs Nav -->
    <ul class="nav nav-tabs nav-tabs-custom mb-4" id="projectsTab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="running-tab" data-bs-toggle="tab" data-bs-target="#running-pane" type="button" role="tab" aria-controls="running-pane" aria-selected="true">
                <i class="fa-solid fa-play me-2"></i>Running Projects
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="pending-tab" data-bs-toggle="tab" data-bs-target="#pending-pane" type="button" role="tab" aria-controls="pending-pane" aria-selected="false">
                <i class="fa-solid fa-clock-rotate-left me-2"></i>Awaiting Approval
            </button>
        </li>
    </ul>

    <!-- Tabs Content -->
    <div class="tab-content flex-grow-1" id="projectsTabContent">
        <!-- Running Projects Pane -->
        <div class="tab-pane fade show active" id="running-pane" role="tabpanel" aria-labelledby="running-tab">
            <div class="table-custom-container">
                <table class="table-custom">
                    <thead>
                        <tr>
                            <th>Project Name</th>
                            <th>Lead Manager</th>
                            <th>Department</th>
                            <th>Status</th>
                            <th>Progress</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="projects-table-body-running">
                        <!-- Dynamically populated running projects -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Pending Approval Projects Pane -->
        <div class="tab-pane fade" id="pending-pane" role="tabpanel" aria-labelledby="pending-tab">
            <div class="table-custom-container">
                <table class="table-custom">
                    <thead>
                        <tr>
                            <th>Project Name</th>
                            <th>Lead Manager</th>
                            <th>Department</th>
                            <th>Status</th>
                            <th>Submitted Date</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="projects-table-body-pending">
                        <!-- Dynamically populated projects awaiting approval -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Add Project Modal -->
<div class="modal fade" id="addProjectModal" tabindex="-1" aria-labelledby="addProjectModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content modal-content-custom">
            <div class="modal-header modal-header-custom">
                <h5 class="modal-title fw-bold text-white" id="addProjectModalLabel">Launch New Project</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="addProjectForm">
                <div class="modal-body p-4">
                    <div class="mb-3">
                        <label for="projectName" class="form-label-custom">Project Name</label>
                        <input type="text" class="form-control form-control-custom" id="projectName" required placeholder="e.g. WorkHub Redesign">
                    </div>
                    <div class="mb-3">
                        <label for="projectManager" class="form-label-custom">Lead Manager</label>
                        <select class="form-select form-select-custom" id="projectManager" disabled>
                            <!-- Locked to the manager's name -->
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="projectDept" class="form-label-custom">Department</label>
                        <select class="form-select form-select-custom" id="projectDept" required>
                            <option value="" disabled selected>Select Department...</option>
                        </select>
                    </div>
                    <!-- Status is omitted to enforce default approval flow -->
                </div>
                <div class="modal-footer modal-footer-custom">
                    <button type="button" class="btn btn-secondary-custom" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary-custom">Create Project</button>
                </div>
            </form>
        </div>
    </div>
</div>
