<div class="container-fluid py-3 h-100 d-flex flex-column fade-in-view">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="mb-1 fw-bold text-white">Task Assignments</h4>
            <p class="text-secondary small mb-0">Assign, delegate, and manage workloads for team staff</p>
        </div>
        <button class="btn btn-primary-custom" data-bs-toggle="modal" data-bs-target="#addTaskModal">
            <i class="fa-solid fa-plus me-2"></i>Add Task
        </button>
    </div>

    <!-- Filters Bar -->
    <div class="card-custom p-3 mb-4">
        <div class="row g-3">
            <div class="col-md-4 col-sm-12">
                <div class="input-group align-items-center px-2 py-1 rounded-pill" style="background-color: var(--bg-main); border: 1px solid var(--border-color);">
                    <i class="fa-solid fa-magnifying-glass text-muted me-2"></i>
                    <input type="text" id="assign-search-input" class="form-control bg-transparent border-0 text-white shadow-none p-0" placeholder="Search tasks...">
                </div>
            </div>
            <div class="col-md-4 col-sm-6">
                <select class="form-select form-select-custom" id="assign-filter-priority">
                    <option value="all">All Priorities</option>
                    <option value="high">High Priority</option>
                    <option value="medium">Medium Priority</option>
                    <option value="low">Low Priority</option>
                </select>
            </div>
            <div class="col-md-4 col-sm-6">
                <select class="form-select form-select-custom" id="assign-filter-status">
                    <option value="all">All Statuses</option>
                    <option value="todo">To Do</option>
                    <option value="progress">In Progress</option>
                    <option value="review">In Review</option>
                    <option value="done">Completed</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Assignments Table -->
    <div class="table-custom-container">
        <table class="table-custom">
            <thead>
                <tr>
                    <th>Task Name</th>
                    <th>Project</th>
                    <th>Department</th>
                    <th>Priority</th>
                    <th>Status</th>
                    <th class="text-end">Assign Employee</th>
                </tr>
            </thead>
            <tbody id="assignments-table-body">
                <!-- Dynamically injected rows -->
            </tbody>
        </table>
    </div>

    <!-- Add Task Modal -->
    <div class="modal fade" id="addTaskModal" tabindex="-1" aria-labelledby="addTaskModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-content-custom">
                <div class="modal-header modal-header-custom">
                    <h5 class="modal-title fw-bold text-white" id="addTaskModalLabel">Create Operational Task</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="addTaskForm">
                    <div class="modal-body p-4">
                        <div class="mb-3">
                            <label for="taskTitle" class="form-label-custom">Task Name</label>
                            <input type="text" class="form-control form-control-custom" id="taskTitle" required placeholder="e.g. Implement Oauth2 Flow">
                        </div>
                        <div class="mb-3">
                            <label for="taskDept" class="form-label-custom">Department</label>
                            <select class="form-select form-select-custom" id="taskDept" required>
                                <option value="" disabled selected>Select Department...</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="taskProj" class="form-label-custom">Related Project</label>
                            <select class="form-select form-select-custom" id="taskProj" required disabled>
                                <option value="" disabled selected>Select Department first...</option>
                            </select>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label for="taskPriority" class="form-label-custom">Priority</label>
                                <select class="form-select form-select-custom" id="taskPriority" required>
                                    <option value="high">High</option>
                                    <option value="medium" selected>Medium</option>
                                    <option value="low">Low</option>
                                </select>
                            </div>
                            <div class="col-6 mb-3">
                                <label for="taskStatus" class="form-label-custom">Initial Status</label>
                                <select class="form-select form-select-custom" id="taskStatus" required>
                                    <option value="todo" selected>To Do</option>
                                    <option value="progress">In Progress</option>
                                    <option value="review">In Review</option>
                                    <option value="done">Completed</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="taskAssignee" class="form-label-custom">Assigned To</label>
                            <select class="form-select form-select-custom" id="taskAssignee">
                                <option value="">Unassigned</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer modal-footer-custom">
                        <button type="button" class="btn btn-secondary-custom" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary-custom">Create Task</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
